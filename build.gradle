plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '2.1.0'
group = 'com.spatialgroups'

base {
    archivesName = 'simple-voice-chat-spatialgroups-neoforge-1.21.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.264'

    runs {
        client {
            client()
        }
        server {
            server()
            programArguments.addAll '--nogui'
        }
    }

    mods {
        spatialgroups {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://libraries.minecraft.net/' }
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}

dependencies {
    // The Simple Voice Chat plugin API that ships with voicechat 1.21.1-2.6.x.
    // The @jar suffix is required because the published pom has packaging=pom.
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.20@jar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    // Reproducible archives so the published SHA-256 stays valid when rebuilt.
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar {
    manifest {
        attributes([
                'Specification-Title'    : 'spatialgroups',
                'Specification-Vendor'   : 'SpatialGroups',
                'Specification-Version'  : project.version,
                'Implementation-Title'   : 'spatialgroups',
                'Implementation-Version' : project.version,
                'Implementation-Vendor'  : 'SpatialGroups'
        ])
    }
}
